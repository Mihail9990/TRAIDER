[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-impulse-trader"
version = "0.1.0"
description = "Trading strategy engine for AI Impulse Trader"
requires-python = ">=3.9"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"run_*.py" = ["E402"]
